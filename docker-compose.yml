services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook_delivery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build: ./services/core-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: webhook
      DB_PASSWORD: webhook
      DB_NAME: webhook_delivery
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    volumes:
      - ./services/core-api:/app
      - core-api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  event-source:
    build: ./services/event-source
    restart: unless-stopped
    environment:
      PORT: 3001
      CORE_API_URL: http://core-api:3000
      EVENT_INTERVAL_MS: 10000
    ports:
      - "3001:3001"
    volumes:
      - ./services/event-source:/app
      - event-source-node-modules:/app/node_modules
    depends_on:
      - core-api

  receiver:
    build: ./services/receiver
    restart: unless-stopped
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    volumes:
      - ./services/receiver:/app
      - receiver-node-modules:/app/node_modules
    depends_on:
      - core-api

volumes:
  pgdata:
  core-api-node-modules:
  event-source-node-modules:
  receiver-node-modules:
