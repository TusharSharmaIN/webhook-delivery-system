services:
  - type: web
    name: core-api
    runtime: node
    plan: free
    rootDir: services/core-api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: event-source
    runtime: node
    plan: free
    rootDir: services/event-source
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: CORE_API_URL
        sync: false
      - key: EVENT_INTERVAL_MS
        value: 10000

  - type: web
    name: receiver
    runtime: node
    plan: free
    rootDir: services/receiver
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
